name: Shaka Release

on:
  workflow_dispatch:
    inputs:
      publish_container:
        description: "Publicar também a imagem no GitHub Container Registry"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Tag SemVer a ser publicada em execução manual"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: shaka-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-v2-

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          release_tag="${{ inputs.release_tag }}"
          if [[ -n "$release_tag" && "$release_tag" != "v${version}" ]]; then
            echo "Input release_tag $release_tag does not match package version v${version}" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v${version}" >&2
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile workspace
        run: cargo check --workspace --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A missing_docs -A clippy::missing_errors_doc

      - name: Secret scan
        run: python3 ./scripts/secret_scan.py

      - name: Workflow policy
        run: python3 ./scripts/workflow_policy_check.py

      - name: Version preflight tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Version preflight
        shell: bash
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [[ -z "$release_tag" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$release_tag" ]]; then
            python3 ./scripts/version_preflight.py --tag "$release_tag"
          else
            python3 ./scripts/version_preflight.py --allow-no-tag --allow-unreleased
          fi

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Dependency audit
        run: cargo audit

      - name: Production smoke test
        run: bash ./scripts/production_smoke.sh

      - name: Build release binary
        run: cargo build --release --locked -p shaka-cli

      - name: Generate SBOM
        shell: bash
        run: |
          mkdir -p dist
          cargo metadata --locked --format-version 1 > dist/cargo-metadata.json
          python3 ./scripts/generate_sbom.py dist/cargo-metadata.json dist/shaka.cdx.json
          rm dist/cargo-metadata.json

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/shaka dist/shaka-linux-x86_64
          sha256sum dist/shaka-linux-x86_64 dist/shaka.cdx.json > dist/SHA256SUMS
          release_tag="${{ inputs.release_tag }}"
          if [[ -z "$release_tag" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ -z "$release_tag" ]]; then
            release_tag="v${{ steps.version.outputs.version }}"
          fi
          tar -C dist -czf "dist/shaka-${release_tag}-linux-x86_64.tar.gz" shaka-linux-x86_64 shaka.cdx.json SHA256SUMS
          (cd dist && zip -q "shaka-${release_tag}-linux-x86_64.zip" shaka-linux-x86_64 shaka.cdx.json SHA256SUMS)

      - name: Attest binary and SBOM
        if: github.event.repository.visibility == 'public' && github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          subject-path: dist/shaka-linux-x86_64
          sbom-path: dist/shaka.cdx.json

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shaka-${{ steps.version.outputs.version }}-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ inputs.release_tag || github.ref_name }}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            if ! gh release create "$release_tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Shaka $release_tag" \
              --generate-notes; then
              gh release upload "$release_tag" dist/* \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
            fi
          fi

  publish-container:
    name: Publish container to GHCR
    needs: validate
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_container == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push image
        id: push
        shell: bash
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [[ -z "$release_tag" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ -z "$release_tag" ]]; then
            release_tag="latest"
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shaka-agente:$release_tag"
          docker build --pull --tag "$image" .
          docker push "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            latest="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shaka-agente:latest"
            docker tag "$image" "$latest"
            docker push "$latest"
          fi

      - name: Attest container provenance
        if: github.event.repository.visibility == 'public' && github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/shaka-agente
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

name: Shaka Fuzzing

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Tempo máximo por alvo de fuzzing"
        required: false
        default: "60"
        type: string

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz approval verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly-2025-05-01

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.12.0 --locked

      - name: Run approval registry fuzz target
        working-directory: fuzz
        run: cargo fuzz run approval_registry -- -max_total_time=${{ inputs.duration_seconds }}

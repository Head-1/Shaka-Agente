name: Shaka CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A missing_docs -A clippy::missing_errors_doc

      - name: Secret scan
        run: python3 ./scripts/secret_scan.py

      - name: Workflow policy
        run: python3 ./scripts/workflow_policy_check.py

      - name: Dependency audit
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit --locked

      - name: Production smoke test
        run: bash ./scripts/production_smoke.sh

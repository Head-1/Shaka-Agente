[workspace]
resolver = "2"
members = [
    "crates/shaka-core",
    "crates/shaka-memory",
    "crates/shaka-skills",
    "crates/shaka-sandbox",
    "crates/shaka-orchestrator",
    "crates/shaka-observability",
    "crates/shaka-cli",
    "crates/shaka-config",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.3.0"
authors = ["Shaka Contributors"]
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
jsonschema = "0.49.9"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5", features = ["serde"] }
wasmtime = { version = "47.0.3", default-features = false, features = ["runtime", "component-model", "cranelift"] }
wat = "1.227"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
